<div
  class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
  (click)="closeDialog()"
>
  <div
    class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full relative"
    (click)="$event.stopPropagation()"
  >
    <p [ngClass]="textColor + ' ' + textSize" class="text-center mb-6">
      {{ dialogText !== '' ? dialogText : 'confirmation-dialog works!' }}
    </p>

    <div class="flex justify-around space-x-4">
      <button
        class="px-4 py-2 rounded-md text-white"
        [ngClass]="primaryButtonColor + ' ' + buttonTextSize"
        (click)="onPrimaryClick()"
        [disabled]="loading"
      >
        <div class="flex justify-center items-center">
          <span
            *ngIf="loading"
            class="animate-spin border-2 border-white border-t-transparent rounded-full w-4 h-4 mr-2"
          ></span
          ><span>
            {{ primaryButtonText }}
          </span>
        </div>
      </button>
      <button
        class="px-4 py-2 rounded-md text-white"
        [ngClass]="secondaryButtonColor + ' ' + buttonTextSize"
        (click)="onSecondaryClick()"
        [disabled]="loading"
      >
        {{ secondaryButtonText }}
      </button>
    </div>
  </div>
</div>

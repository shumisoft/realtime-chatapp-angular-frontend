<!-- Backdrop -->
<div class="fixed inset-0 bg-black/50 flex items-center justify-center">
  <!-- Modal Card -->
  <div
    class="bg-white w-full max-w-lg rounded-md shadow-lg px-6 py-4"
    (click)="$event.stopPropagation()"
  >
    <!-- Title and Close Button -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold">Start New Chat</h2>
      <div title="Close" class="rounded-full text-gray-500 hover:text-black cursor-pointer">
        <icon-close (click)="close.emit()" />
      </div>
    </div>

    <!-- Search Area -->
    <app-user-search
      placeholder="Search user to start chat..."
      (userSelected)="onUserClick($event)"
    />
  </div>
</div>

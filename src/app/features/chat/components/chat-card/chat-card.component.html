<div
  class="left-bubble outer-container"
  [class.right-bubble]="message.userId === (principalUser$ | async)?.userId"
>
  <p class="text-xs">{{ message.userId }}</p>
  <p>{{ message.content }}</p>
  <div class="flex">
    <p class="ml-auto text-xs">{{ message.timestamp | date }}</p>
  </div>
</div>

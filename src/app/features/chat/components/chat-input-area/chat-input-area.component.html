@if (imagePreviewUrl) {
  <app-image-preview
    [imageUrl]="imagePreviewUrl"
    [removable]="true"
    (remove)="removeSelectedImage()"
    (imageClicked)="openViewer()"
  />
}
<div class="flex items-center gap-2 p-3 border-t border-gray-300 bg-white">
  <textarea
    [(ngModel)]="message"
    (keyup.enter)="onSend()"
    placeholder="Type a message..."
    class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    (ngModelChange)="onTyping($event)"
  ></textarea>

  <input type="file" accept="image/*" hidden #fileInput (change)="onImageSelected($event)" />

  <div
    title="Attach image"
    class="text-gray-500 hover:text-primary-500 cursor-pointer"
    (click)="fileInput.click()"
  >
    <icon-attach-file />
  </div>

  <button
    (click)="onSend()"
    title="Send"
    class="flex justify-between items-center gap-1.5 px-4 py-2 font-medium text-white bg-primary-500 rounded-lg hover:bg-blue-600 active:bg-primary-700 cursor-pointer"
  >
    Send
    <icon-send />
  </button>
</div>
@if (isViewerOpen) {
  <app-image-viewer-modal [imageUrl]="imagePreviewUrl" (close)="closeViewer()" />
}

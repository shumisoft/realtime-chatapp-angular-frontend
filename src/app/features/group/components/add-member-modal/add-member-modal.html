<!-- Backdrop -->
<div class="fixed inset-0 bg-black/50 flex items-center justify-center">
  <!-- Modal -->
  <div
    class="bg-white w-full max-w-lg rounded-md shadow-lg px-6 py-4"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold">Add Member</h2>
      <div title="Close" class="cursor-pointer text-gray-500 hover:text-black">
        <i class="fa-solid fa-xmark" (click)="close.emit()"></i>
      </div>
    </div>

    <!-- Search -->
    <app-user-search
      placeholder="Search user to add..."
      [disabledUserIds]="existingMemberIds"
      (userSelected)="onUserClick($event)"
    />
  </div>
</div>

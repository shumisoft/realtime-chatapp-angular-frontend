<div class="min-h-screen flex items-center justify-center bg-background px-4">
  <div class="w-full max-w-md bg-white shadow-card rounded-lg p-8">
    <h1 class="text-2xl font-semibold text-primary-600 text-center mb-6">Login to Continue</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"> Username </label>
        <input
          type="text"
          formControlName="username"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 placeholder:text-placeholder"
          placeholder="Enter your username"
        />
        <p
          *ngIf="loginForm.controls['username']?.invalid && loginForm.controls['username']?.touched"
          class="text-error-500 text-xs mt-1"
        >
          Username is required.
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"> Password </label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 placeholder:text-placeholder"
          placeholder="Enter your password"
        />
        <p
          *ngIf="loginForm.controls['password']?.invalid && loginForm.controls['password']?.touched"
          class="text-error-500 text-xs mt-1"
        >
          Password is required.
        </p>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="w-full bg-primary-600 hover:bg-primary-700 text-white py-2 rounded-md transition-colors font-medium"
        [disabled]="loginForm.invalid"
      >
        Login
      </button>
    </form>

    <!-- Register link -->
    <p class="text-center mt-6 text-sm text-gray-600">
      Don’t have an account?
      <a routerLink="/auth/register" class="text-primary-600 hover:underline font-medium"
        >Register</a
      >
    </p>
  </div>
</div>
